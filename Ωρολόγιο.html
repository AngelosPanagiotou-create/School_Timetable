<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ωρολόγιο</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B2340'/%3E%3Cpath d='M14 22h36M14 32h36M14 42h36M26 14v38M38 14v38' stroke='%23F4F1E8' stroke-width='3'/%3E%3Crect x='27.5' y='33.5' width='9' height='7' fill='%231E5B4F'/%3E%3C/svg%3E">
<style>:root{
  --paper:#F4F1E8; --paper2:#F8F5ED; --card:#FFFDF8; --line:#E3DDCF; --line2:#EFEADF;
  --ink:#1B2340; --muted:#5E6478; --muted2:#6A6F80;
  --acc:#1E5B4F; --acc-d:#164539; --acc-soft:#E7F0EC;
  --gap:#A1452F; --bad:#B3261E; --bad-soft:#FBEDEA;
  --tA:#BCD3F2; --tAi:#14335E; --tB:#F4D49A; --tBi:#5A3605; --tG:#B5DFC2; --tGi:#164A2C; --tN:#D9CCEB; --tNi:#3E2A62;
  --empty:#F5F3EE; --emptyl:#E8E4DA; --zone:#F1F8F3; --zonee:#F9FCFA; --zonel:#D9EBDF; --zonei:#2E6B45; --miss:#D93A3A;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Cambria,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--acc)}
#app{display:flex;min-height:100vh}
#print{display:none}

/* --- πλευρική μπάρα --- */
.side{width:224px;flex:none;background:var(--paper2);border-right:1px solid var(--line);padding:26px 14px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.brand{padding:0 12px}
.brand .t{font-family:var(--serif);font-size:30px;line-height:1.05}
.schools{display:flex;flex-direction:column;gap:2px}
.schools .secl{padding:0 12px 4px}
.slist{display:flex;flex-direction:column;gap:2px;max-height:32vh;overflow-y:auto}
.sch{display:grid;grid-template-columns:10px 1fr;column-gap:10px;align-items:center;text-align:left;padding:7px 12px;min-height:36px;border:0;border-radius:10px;background:transparent;color:#4E5468;cursor:pointer;font-size:13px}
.sch:hover{background:#ECE7DA;color:var(--ink)}
.sch .sd{width:8px;height:8px;border-radius:9px;background:#CFC6B2}
.sch .sn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sch small{grid-column:2;font-size:11px;color:var(--muted2)}
.sch.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px #D9D2C2}
.sch.on .sd{background:var(--acc)}
.sch.on .sn{font-weight:700}
.sch.add{display:flex;gap:8px;color:var(--acc);font-weight:600}
.side .nav{border-top:1px solid var(--line);padding-top:14px}
.schoolbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;margin:0 4px;padding:10px 30px 10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;position:relative}
.schoolbtn:hover{border-color:#CFC6B2}
.schoolbtn .k{font-size:10.5px;letter-spacing:.7px;color:var(--muted2);text-transform:uppercase}
.schoolbtn b{font-size:13px;font-weight:600;line-height:1.3}
.schoolbtn i{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted2)}
.brand .s{font-size:11.5px;color:var(--muted2);letter-spacing:.5px;margin-top:6px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:42px;border:0;border-radius:10px;background:transparent;color:#4E5468;font-weight:500;cursor:pointer;text-align:left}
.nav button:hover{background:#ECE7DA;color:var(--ink)}
.nav button.on{background:var(--ink);color:#F7F4EC}
.nav svg{flex:none}
.store{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.store .k{font-size:10.5px;letter-spacing:.7px;color:var(--muted2);text-transform:uppercase}
.store .v{font-weight:600;word-break:break-all}
.store .w{color:var(--gap)}
.dot{display:inline-block;width:8px;height:8px;border-radius:9px;margin-right:6px;vertical-align:1px}

/* --- κύρια περιοχή --- */
.main{flex:1;min-width:0;padding:30px 32px 48px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:11.5px;letter-spacing:1.3px;color:var(--acc);font-weight:700;text-transform:uppercase}
h1{margin:6px 0 0;font-family:var(--serif);font-weight:400;font-size:36px;line-height:1.1}
h2{margin:0;font-family:var(--serif);font-weight:400;font-size:21px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid #D9D2C2;background:var(--card);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F6F2E8}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-d)}
.btn.dng{color:#9A2219;border-color:#E5BDB3}
.btn.dng:hover{background:var(--bad-soft)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn.icon{width:42px;padding:0;justify-content:center}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:12px;background:#FBF1DE;border:1px solid #EBD3A6;color:#5A3A0A}
.banner.ok{background:var(--acc-soft);border-color:#CFE2D8;color:#123C33}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.sub{font-size:12.5px;color:var(--muted2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.stat .k{font-size:12px;color:var(--muted2)}
.stat .v{font-family:var(--serif);font-size:30px;margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:#4E5468;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:14px;border-radius:4px;display:inline-block}

/* --- πλέγμα προγράμματος --- */
.sched{display:flex;gap:16px;align-items:flex-start}
.gridbox{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:calc(100vh - 120px);box-shadow:0 12px 32px -20px rgba(27,35,64,.3)}
.g{display:grid;grid-template-columns:186px repeat(35,minmax(30px,1fr)) 150px;min-width:1390px}
.hcol{grid-column:span 1!important;padding-top:12px!important;box-shadow:inset 2px 0 0 #CFC6B2;font-family:var(--sans)!important;font-size:12px!important;color:var(--muted2)}
.hc{box-shadow:inset 2px 0 0 #CFC6B2;border-bottom:1px solid var(--line2);padding:4px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.hc b{font-size:13px;font-weight:700}
.hc small{font-size:10.5px;color:var(--muted2);line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hc.off b{color:var(--gap)}
.g .hd{position:sticky;top:0;z-index:3;background:var(--card)}
.g .hd2{position:sticky;top:34px;z-index:3;background:var(--card);border-bottom:1px solid var(--line)}
.dayh{grid-column:span 7;text-align:center;font-family:var(--serif);font-size:16px;padding:9px 0 3px;box-shadow:inset 2px 0 0 #CFC6B2}
.hn{text-align:center;font-size:11px;color:var(--muted2);padding:4px 0 6px}
.d0{box-shadow:inset 2px 0 0 #CFC6B2}
.nm{position:sticky;left:0;z-index:2;background:var(--card);padding:5px 12px 5px 16px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;justify-content:center;min-width:0;cursor:pointer}
.nm b{font-size:12px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.nm small{font-size:11px;color:var(--muted2)}
.nm small .gp{color:var(--gap);font-weight:600}
.cell{height:38px;padding:3px;border-bottom:1px solid var(--line2);position:relative;display:flex}
/* κενό: χωρίς χρώμα */
.hn.zone{font-weight:700;color:var(--ink)}
.cell .dbl{position:absolute;left:1px;top:1px;bottom:1px;width:calc(200% - 2px);border:2px solid var(--ink);border-radius:8px;pointer-events:none;z-index:1}
.cell .dbl i{position:absolute;right:3px;top:-7px;font-style:normal;font-size:8.5px;font-weight:700;line-height:11px;padding:0 3px;border-radius:4px;background:var(--ink);color:#fff;letter-spacing:.2px}
.cell.pref::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:5px;background:#D9A54A;opacity:.8}
.tag:empty{background:var(--empty);box-shadow:inset 0 0 0 1px var(--emptyl)}
/* κώλυμα: κουτάκι γεμάτο τελίτσες */
.cell.closed{background:repeating-linear-gradient(45deg,#E6E1D5 0 2px,#F4F1EA 2px 9px)}
.cell.no .tag:empty{background-color:var(--empty);background-image:radial-gradient(#8A8577 1.2px,transparent 1.4px);background-size:6px 6px}
/* ώρα που λείπει από τμήμα: μεγάλο κόκκινο Χ */
.cell.miss .tag{background:linear-gradient(to top right,transparent calc(50% - 1.5px),var(--miss) calc(50% - 1.5px),var(--miss) calc(50% + 1.5px),transparent calc(50% + 1.5px)),linear-gradient(to bottom right,transparent calc(50% - 1.5px),var(--miss) calc(50% - 1.5px),var(--miss) calc(50% + 1.5px),transparent calc(50% + 1.5px)),var(--empty)!important;box-shadow:inset 0 0 0 1px #E8B4B4!important}
.nm small .ms{color:var(--miss);font-weight:700}
.cell.drop-ok{background:var(--acc-soft)}
.cell.drop-ok .tag:empty{box-shadow:inset 0 0 0 1px #9CC4B5}
.cell.drop-hover{background:#CFE2D8!important}
.cell.drop-hover .tag{box-shadow:inset 0 0 0 2px var(--acc)}
.tag{flex:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;cursor:grab;user-select:none;position:relative}
.tag:empty{cursor:pointer}
/* κουτάκια μαθημάτων: λευκά, το χρώμα έρχεται από την παλέτα του χρήστη */
.tag.fA,.tag.fB,.tag.fG,.tag.fN{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #CFC8B8}
.tag.grp{box-shadow:inset 0 0 0 2px #3A4057}
.tag.lock::before{content:"";position:absolute;left:2px;top:2px;width:6px;height:6px;border-radius:2px;background:var(--ink)}
.tag.sel{background:var(--acc)!important;color:#fff!important;box-shadow:0 2px 8px rgba(30,91,79,.4)}
.tag.bad{background:#D93A3A!important;color:#fff!important;box-shadow:none!important}
.rowhl .nm,.rowhl .cell{background-color:#FBF8EF}

.sidecol{width:270px;flex:none;display:flex;flex-direction:column;gap:12px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto}
.sidecol .tray{width:auto;position:static;max-height:none;overflow:visible}
.issuesbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .3s}
.issuesbox.flash{box-shadow:0 0 0 3px #E5BDB3}
.issuesbox .ih{display:flex;align-items:center;justify-content:space-between}
.issuesbox h3{margin:0;font-family:var(--serif);font-weight:400;font-size:18px}
.issuesbox .ic{min-width:26px;height:22px;padding:0 7px;border-radius:99px;background:#B3261E;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.issuesbox .ic.ok{background:var(--acc)}
.issuesbox .isec{display:flex;flex-direction:column;gap:5px}
.issuesbox .ist{font-size:11px;letter-spacing:.5px;font-weight:700;color:#3C4257;text-transform:uppercase}
.issuesbox summary{font-size:12.5px;font-weight:600;color:#5A3A0A;cursor:pointer;padding:2px 0}
.issuesbox details[open] summary{margin-bottom:5px}
.iss{font-size:12px;line-height:1.4;padding:6px 9px;border-radius:8px;background:var(--bad-soft);color:#7E1913}
.iss.w{background:#FBF1DE;color:#5A3A0A;margin-top:4px}
.iss.i{background:#EEF1F6;color:#2E3A57}
.iss.link{cursor:pointer}
.iss.link:hover{box-shadow:inset 0 0 0 1px currentColor}
.iss.on{box-shadow:inset 0 0 0 2px currentColor}
.nm.hl,.cell.hl{background-color:#FBEFD9!important}
.gempty{grid-column:1 / -1;padding:36px 16px;text-align:left;position:sticky;left:0;color:var(--muted2);font-size:13.5px;border-bottom:1px solid var(--line2)}
.tray{width:250px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:20px}
.tray.drop-ok{box-shadow:inset 0 0 0 2px #9CC4B5}
.tray h3{margin:0;font-family:var(--serif);font-weight:400;font-size:18px}
.pgrp{display:flex;flex-direction:column;gap:6px}
.pgrp .who{font-size:11.5px;font-weight:600;color:#3C4257}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:700;cursor:grab;border:0}
.pchip i{font-style:normal;font-weight:500;opacity:.75}
.pchip.sel{background:var(--acc)!important;color:#fff!important}

/* --- λίστα + λεπτομέρεια --- */
.split{display:flex;gap:20px;align-items:flex-start}
.list{width:290px;flex:none;display:flex;flex-direction:column;gap:12px}
.list .items{display:flex;flex-direction:column;gap:2px}
.li{display:flex;flex-direction:column;gap:1px;padding:9px 14px;border-radius:10px;border:0;background:transparent;text-align:left;cursor:pointer;min-height:44px;justify-content:center}
.li:hover{background:#ECE7DA}
.li.on{background:var(--card);box-shadow:inset 0 0 0 1px #D9D2C2,0 4px 14px -8px rgba(27,35,64,.3)}
.li b{font-size:13px;font-weight:600}
.li small{font-size:11.5px;color:var(--muted2)}
.secl{font-size:10.5px;letter-spacing:.8px;color:var(--muted2);text-transform:uppercase;padding:10px 14px 4px}
.detail{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:20px;align-items:start}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f>span{font-size:12px;color:var(--muted);font-weight:500}
.inp{border:1px solid #D9D2C2;border-radius:10px;padding:0 12px;min-height:42px;background:#fff;width:100%}
.inp:focus{outline:2px solid #9CC4B5;outline-offset:0;border-color:var(--acc)}
.inp::placeholder{color:#8A8E9C}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.meter{height:8px;border-radius:9px;background:var(--line2);overflow:hidden}
.meter>div{height:8px;border-radius:9px;background:var(--acc)}
.meter.over>div{background:var(--gap)}
.seg{display:flex;padding:4px;border-radius:12px;background:#EFEADF;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:600;font-size:13px;color:#4E5468;padding:0 10px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(27,35,64,.15)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:40px;height:40px;border-radius:10px;border:1px solid #D9D2C2;background:#fff;cursor:pointer;font-size:19px}
.stp b{font-family:var(--serif);font-size:26px;font-weight:400;min-width:30px;text-align:center}
.lr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.sw2{width:42px;height:24px;border-radius:99px;background:#D6D0C2;position:relative;flex:none;border:0;cursor:pointer;padding:0}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:99px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw2.on{background:var(--acc)} .sw2.on::after{left:21px}

/* πίνακες 5×7 */
.wk{display:grid;grid-template-columns:86px repeat(7,minmax(0,1fr));gap:5px;align-items:center}
.wk .h{text-align:center;font-size:11px;color:var(--muted2)}
.wk .d{font-family:var(--serif);font-size:15px}
.sl{height:34px;border-radius:7px;border:0;cursor:pointer;font-size:11px;font-weight:700}
.sl.ok,.sl.any{background:#F3F0E7;color:#8A8E9C;box-shadow:inset 0 0 0 1px var(--line)}
.sl.pref{background:#FBEFD9;color:#7A4A0B;box-shadow:inset 0 0 0 1px #EBD3A6}
.sl.no,.sl.never{background:repeating-linear-gradient(135deg,#F3DCD6 0 3px,#FBF0EC 3px 7px);color:#8E1B15;box-shadow:inset 0 0 0 1px #E5BDB3}
.sl.must{background:var(--acc);color:#fff}
.qk{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid #D9D2C2;background:#fff;cursor:pointer;font-size:12.5px}
.qk:hover{background:#F6F2E8}

/* αναθέσεις */
.at{width:100%;border-collapse:collapse}
.at th{font-size:10.5px;letter-spacing:.8px;color:var(--muted2);text-align:left;font-weight:600;padding:6px 8px;text-transform:uppercase}
.at td{padding:10px 8px;border-top:1px solid var(--line2);vertical-align:middle}
.ctag{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:700;margin:2px 4px 2px 0}
.ctag.fA{background:var(--tA);color:var(--tAi)} .ctag.fB{background:var(--tB);color:var(--tBi)} .ctag.fG{background:var(--tG);color:var(--tGi)} .ctag.fN{background:var(--tN);color:var(--tNi)}
.rule{display:inline-flex;font-size:11.5px;padding:4px 9px;border-radius:99px;background:#F1EDE3;color:#3C4257;margin:2px 4px 2px 0;white-space:nowrap}
.num{font-family:var(--serif);font-size:20px}
.empty{padding:28px;text-align:center;color:var(--muted2);border:1px dashed #D9D2C2;border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.cch{min-width:56px;min-height:38px;padding:0 12px;border-radius:9px;border:1px solid #D9D2C2;background:#fff;cursor:pointer;font-weight:700;font-size:13px;color:#3C4257}
.cch.on.fA{background:var(--tA);color:var(--tAi);border-color:var(--tAi)}
.cch.on.fB{background:var(--tB);color:var(--tBi);border-color:var(--tBi)}
.cch.on.fG{background:var(--tG);color:var(--tGi);border-color:var(--tGi)}
.cch.on.fN{background:var(--tN);color:var(--tNi);border-color:var(--tNi)}
.warns{display:flex;flex-direction:column;gap:6px}
.warn{font-size:12.5px;padding:8px 12px;border-radius:9px;background:#FBF1DE;color:#5A3A0A}
.warn.error{background:var(--bad-soft);color:#7E1913}
.warn.info{background:#EEF1F6;color:#2E3A57}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;max-width:900px;text-align:left}
.steps>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.steps b{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--acc)}

/* παράθυρα */
.ov{position:fixed;inset:0;background:rgba(27,35,64,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.dlg{background:var(--card);border-radius:20px;width:100%;max-width:1040px;box-shadow:0 30px 80px -20px rgba(10,14,30,.55);display:flex;flex-direction:column}
.dlg.small{max-width:660px}
.dlg.wide{max-width:1300px}
.pv-pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px;background:#E9E5DA;border-radius:12px;max-height:62vh;overflow:auto}
.pv-page{background:#fff;width:297mm;min-height:210mm;box-shadow:0 6px 24px -8px rgba(10,14,30,.35);flex:none}
.pv-page .pp{page-break-after:auto}
.dlg header{display:flex;justify-content:space-between;gap:16px;padding:24px 28px 16px;border-bottom:1px solid var(--line2)}
.dlg .body{padding:20px 28px;display:flex;flex-direction:column;gap:18px}
.dlg .cols2{display:flex;flex-wrap:wrap}
.dlg .cols2>div{flex:1 1 420px;min-width:0;padding:20px 28px;display:flex;flex-direction:column;gap:18px}
.dlg .cols2>div+div{border-left:1px solid var(--line2)}
.dlg footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:16px 28px 22px;border-top:1px solid var(--line2)}
.prog{height:10px;border-radius:9px;background:var(--line2);overflow:hidden}
.prog>div{height:10px;background:var(--acc);border-radius:9px;transition:width .4s}
.menu{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -12px rgba(10,14,30,.4);padding:6px;display:flex;flex-direction:column;min-width:220px}
.menu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}
.menu button:hover{background:#F1EDE3}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--ink);color:#F7F4EC;padding:12px 16px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:420px;font-size:13.5px}
.toast.err{background:#7E1913}
.issues{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto}

/* --- εκτύπωση --- */
@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  #app,.ov,.toasts,.menu{display:none!important}
  #print{display:block}
}
.pp{page-break-after:always;break-after:page;color:#111;font-family:var(--sans);padding:9mm 10mm;box-sizing:border-box}
.pp:last-child{page-break-after:auto;break-after:auto}
.pp .ph{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:14px;padding-bottom:7px;border-bottom:1.5px solid #111;margin-bottom:8px}
.pp .ph .l{font-size:9.5pt;font-weight:700;letter-spacing:.5px}
.pp .ph .c{font-family:var(--serif);font-size:18pt;text-align:center}
.pp .ph .r{font-size:9pt;text-align:right}
.pt{width:100%;border-collapse:collapse;table-layout:fixed;border:1.5px solid #111}
.pt th,.pt td{border:.5pt solid #9a9a9a;text-align:center;padding:0;overflow:hidden;white-space:nowrap}
.pt th.nmh,.pt td.nmc{text-align:left;padding:0 5px;width:44mm;font-size:8pt;font-weight:700}
.pt th.dy{font-family:var(--serif);font-size:10.5pt;font-weight:400;padding:3px 0}
.pt th.hr{font-size:7pt;font-weight:400;color:#333;height:13px}
.pt td{height:6.6mm;font-size:7.4pt;font-weight:600;letter-spacing:-.2px}
.pt .dl{border-left:1.6px solid #111}
.pt th.hrh{font-size:7.5pt;font-weight:700}
.pt td.hrc{white-space:normal;text-align:left;padding:0 3px;line-height:1.1}
.pt td.hrc b{font-size:8pt;display:block}
.pt td.hrc span{font-size:5.6pt;font-weight:500;display:block}
.pt.pc td{font-size:6.6pt;font-weight:600;vertical-align:middle}
.pt.pc td .vn{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);line-height:1;max-height:100%;overflow:hidden;margin:0 .3px}
.pt.pc td.nmc{font-size:10pt}
.pt.pc td.hn2{white-space:nowrap;line-height:1.08;letter-spacing:-.25px;padding:0 .2mm;font-weight:600}
.pt.pc td.hn2 div{overflow:hidden}
.pt.pc td.kt{font-size:5.4pt;font-weight:400;font-style:italic;color:#555}
.pt.pc tr.sep td{height:4.2mm;text-align:left;padding:0 6px;font-size:7.5pt;font-weight:700;letter-spacing:.4px;background:#ECECEC;border-top:1.2pt solid #111}
.pt.pc td.st{font-size:5pt;line-height:1.12;letter-spacing:-.3px}
.pt.pc td.st div{overflow:hidden}
.pt.pc td.ms{background:linear-gradient(to top right,transparent calc(50% - .5pt),#999 calc(50% - .5pt),#999 calc(50% + .5pt),transparent calc(50% + .5pt)),linear-gradient(to bottom right,transparent calc(50% - .5pt),#999 calc(50% - .5pt),#999 calc(50% + .5pt),transparent calc(50% + .5pt))}
.pp .pf{display:flex;justify-content:space-between;font-size:8pt;color:#333;margin-top:10px}

/* ανάθεση μέσα στην καρτέλα */
.dlg.inline{max-width:none;box-shadow:0 10px 30px -18px rgba(27,35,64,.35);border:1.5px solid var(--acc);border-radius:16px;background:#FFFEFA}
.dlg.inline header{padding:18px 24px 12px}
.dlg.inline .cols2>div{padding:18px 24px}
.dlg.inline footer{padding:14px 24px 18px}
#asg-editor{scroll-margin-top:20px}

/* Σελίδα «Τμήματα»: ακίνητη σελίδα, κυλάει μόνο η λίστα τμημάτων */
.main.fixed{height:100vh;overflow:hidden}
.main.fixed .split{flex:1;min-height:0}
.main.fixed .list{height:100%;min-height:0}
.main.fixed .list .items{flex:1;min-height:0;overflow-y:auto;padding-right:6px}
.main.fixed .detail{height:100%;min-height:0;overflow-y:auto}

/* μπάρα αποθήκευσης καρτέλας εκπαιδευτικού */
.savebar{position:sticky;top:12px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px 10px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--muted2);font-size:13px}
.savebar.dirty{background:#FBF1DE;border-color:#EBD3A6;color:#5A3A0A;box-shadow:0 8px 24px -14px rgba(90,58,10,.45)}

/* παλέτα */
.legend .palbtn{margin-left:auto;background:#fff;border:1px solid var(--line);gap:8px}
.pal-body{display:grid!important;grid-template-columns:250px 300px 1fr;gap:22px;align-items:start}
.pal-list{display:flex;flex-direction:column;gap:4px}
.pal-row{display:grid;grid-template-columns:26px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:7px 10px;border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer}
.pal-row:hover{background:#F2EEE3}
.pal-row.on{background:#fff;border-color:var(--acc);box-shadow:0 1px 4px rgba(27,35,64,.1)}
.pal-row i{grid-row:span 2}
.pal-row span{font-weight:600;font-size:13px}
.pal-row small{font-size:11px;color:var(--muted2)}
.pal-chip{display:inline-block;width:24px;height:24px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.pal-chip.none{background:#fff linear-gradient(to top right,transparent 46%,#D93A3A 46%,#D93A3A 54%,transparent 54%)}
.pal-grid{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.pal-h{font-size:12.5px;margin-bottom:8px;color:var(--muted)}
.pal-t{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:#3C4257;margin:8px 0 6px}
.pal-row10{display:grid;grid-template-columns:repeat(10,22px);gap:5px}
.pal-row10.tint{gap:0 5px}
.pal-row10.tint+.pal-row10.tint .pal-sw{margin-top:0}
.pal-sw{width:22px;height:20px;border:0;border-radius:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);padding:0}
.pal-row10:not(.tint) .pal-sw{height:22px}
.pal-sw:hover{outline:2px solid #E97132;outline-offset:0;z-index:1;position:relative}
.pal-sw.on{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:2}
.pal-nofill{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;padding:7px 8px;border:0;border-radius:6px;background:#F2EEE3;cursor:pointer;font-size:13px}
.pal-nofill i{width:18px;height:18px}
.pal-nofill.on{box-shadow:inset 0 0 0 2px var(--ink)}
.pal-prev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pal-pg{display:grid;grid-template-columns:repeat(11,1fr);border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.pal-pg.big{grid-template-columns:repeat(8,1fr)}
.pal-pg .cell{height:42px;border-bottom:0;border-right:1px solid var(--line2)}
.pal-pg.big .cell{height:50px}
.pal-pg .tag{cursor:default;font-size:10px}
.pal-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted2);margin-top:5px;gap:8px}

.dlg .cols1{padding:20px 28px;max-width:640px}
.dlg .cols1>div{display:flex;flex-direction:column;gap:18px}
.dlg.inline .cols1{padding:18px 24px}
.dlg .asg2>div:first-child{flex:1.2 1 360px}
.dlg .asg2>div:last-child{flex:1 1 340px}
.dlg.asgdlg{max-width:720px;margin:auto 0}
.dlg.asgdlg .cols2>div{padding:20px 28px}
.dlg.asgdlg .cols1{max-width:none;padding:20px 28px}

Φτιάξε πρώτα τα μικτά τμήματα (π.χ. ΓΘετ, ΓΑνθ).":"Create the mixed groups first.","Τα μαθήματα της ζώνης γίνονται ταυτόχρονα (κάθε μαθητής σε ένα από αυτά) και μόνο μέσα στις ώρες της. Μέσα στη ζώνη δεν μπαίνει κανένα άλλο μάθημα των ίδιων τμημάτων (της ίδιας τάξης) — π.χ. γενική παιδεία.":"The zone’s lessons take place at the same time (each student in one of them) and only within its periods. No other lesson of the same classes (same year) is placed inside the zone — e.g. general subjects.","Η ζώνη είναι σωστή. Η αυτόματη συμπλήρωση θα βάλει τα μαθήματά της μόνο μέσα σε αυτήν.":"The zone is correct. Auto-fill will place its lessons only inside it.","Καθαρισμός ωρών":"Clear periods","Γράψε όνομα ζώνης.":"Enter a zone name.","Κλικ στις ώρες της ζώνης και διάλεξε τα μαθήματά της.":"Click the zone’s periods and choose its lessons.","Νέα ζώνη":"New zone","Ζώνη = ώρες της εβδομάδας όπου γίνονται μόνο ορισμένα μαθήματα (π.χ. τα μαθήματα κατεύθυνσης της Γ΄). Μέσα στη ζώνη δεν μπαίνει άλλο μάθημα της ίδιας τάξης.":"Zone = periods of the week when only certain lessons take place (e.g. the track lessons of the final year). No other lesson of the same year is placed inside the zone.","Ώρες αργότερα":"Periods later","Ορισμός ωρών τώρα":"Set periods now","π.χ. Ξένες γλώσσες Α΄, Κόντρα":"e.g. Foreign languages A","Μόνο έως ώρα":"Only up to period","οποιαδήποτε ώρα":"any period","Όνομα (το γράφεις εσύ)":"Name (you write it)","Τμήματα που κάνουν μάθημα την ίδια ώρα":"Classes that have lessons at the same time","Κανονικά τμήματα":"Regular classes","Πότε":"When","Χωριστές γραμμές στην εκτύπωση":"Separate rows in print","Στη σελίδα τμημάτων κάθε μικτό τμήμα της ομάδας παίρνει δική του γραμμή (π.χ. κατευθύνσεις).":"On the class page, each mixed group of the group gets its own row (e.g. tracks).","Με ένα μόνο τμήμα η ομάδα δεν έχει ακόμα αποτέλεσμα — πρόσθεσε τα υπόλοιπα όταν τα φτιάξεις.":"With only one class the group has no effect yet — add the others once you create them."," — για να γίνονται μαζί πρέπει να έχουν τις ίδιες ώρες.":" — to run together they must have the same periods.","Οδηγία: ":"Note: ","Τα τμήματα μιας ομάδας κάνουν μάθημα πάντα την ίδια ώρα (π.χ. ΑΓαλ και ΑΓερμ). ":"The classes of a group always have their lessons at the same time (e.g. two language groups). ","Αν ένα τμήμα χωρίζεται στη μέση και τα δύο μισά κάνουν διαφορετικό μάθημα, δήλωσε τα μισά ως χωριστά μικτά τμήματα με διαφορετικό όνομα (π.χ. Β1α και Β1β, χρεωμένα στο Β1) και βάλε τα εδώ μαζί.":"If a class splits in half and the two halves have different lessons, declare the halves as separate mixed groups with different names (e.g. B1a and B1b, charged to B1) and put them here together.","Γράψε όνομα (π.χ. «Ξένες γλώσσες Α΄»).":"Enter a name (e.g. “Foreign languages A”).","Διάλεξε τα τμήματα.":"Choose the classes.","Γράψε τα κανονικά τμήματα όπως ονομάζονται στο σχολείο σας (π.χ. Α1, Α2). Οι αλλαγές ονομάτων περνούν παντού — αναθέσεις, μικτά τμήματα, εκτύπωση. Τα μικτά τμήματα (ΑΓαλ κ.λπ.) φτιάχνονται με «+ Μικτό τμήμα».":"Write the regular classes as they are named at your school (e.g. A1, A2). Renames apply everywhere — assignments, mixed groups, print. Mixed groups are created with “+ Mixed group”.","Όνομα τμήματος":"Class name","Αναίρεση διαγραφής":"Undo delete","Προσθήκη τμήματος":"Add class","Οι ονομασίες αποθηκεύτηκαν.":"Names saved.","Διαγραφή τμημάτων":"Delete classes","Ονομασίες τμημάτων του σχολείου":"School class names","Γρήγορη δημιουργία τμημάτων":"Quick class creation","Όσα υπάρχουν ήδη με το ίδιο όνομα δεν ξαναδημιουργούνται.":"Those that already exist with the same name are not created again.","Δημιουργία":"Create","# Μορφή: Επώνυμο Όνομα, Ειδικότητα, τμήματα (κόμμα = άλλη μέρα · Α1Α1 = δίωρο · Α1Α1Α1 = τρίωρο)":"# Format: Surname Name, Subject, classes (comma = another day · A1A1 = double · A1A1A1 = triple)","Εκπαιδευτικοί.md":"Teachers.md","Πρώτα τα τμήματα":"Classes first","Δεν έχουν οριστεί τμήματα στην εφαρμογή.":"No classes are defined in the app.","Φτιάξε πρώτα όλα τα τμήματα του σχολείου (κανονικά και μικτά) στη σελίδα «Τμήματα» και μετά κάνε την εισαγωγή.":"First create all the school’s classes (regular and mixed) on the “Classes” page, then import.","Λείπει το ονοματεπώνυμο στην αρχή της γραμμής.":"The full name is missing at the start of the line.","Το αρχείο δεν έχει γραμμές εκπαιδευτικών.":"The file has no teacher lines.","Νέος":"New","Ίδιος":"Same","Αλλαγές":"Changes"," εκπαιδευτικοί στο αρχείο":" teachers in the file"," νέοι":" new"," υπάρχουν ήδη":" already exist"," γραμμές δεν διαβάστηκαν":" lines could not be read","Η εισαγωγή δεν μπορεί να γίνει. ":"The import cannot be done. ","Αυτά τα τμήματα δεν έχουν οριστεί στην εφαρμογή: ":"These classes are not defined in the app: ","Μικτά τμήματα χωρίς «Χρεώνεται στα τμήματα»: ":"Mixed groups without “Charged to classes”: ","Φτιάξ' τα (ή διόρθωσέ τα) στη σελίδα «Τμήματα», με ακριβώς το ίδιο όνομα, και ξαναδοκίμασε.":"Create (or fix) them on the “Classes” page, with exactly the same name, and try again.","Γραμμή":"Line","Τμήματα (κομμάτια)":"Classes (blocks)","Κατάσταση":"Status","Για όσους υπάρχουν ήδη: ενημερώνονται η ειδικότητα και οι αναθέσεις. Κανόνες που έχεις βάλει σε μια ανάθεση (π.χ. «έως 5η ώρα») μένουν, αν το τμήμα υπάρχει ακόμα στη γραμμή. Κρατιέται αντίγραφο ασφαλείας πριν την εισαγωγή.":"For existing teachers: subject code and assignments are updated. Rules you set on an assignment (e.g. “up to period 5”) stay if the class is still on the line. A backup is kept before the import.","Εισαγωγή από αρχείο md":"Import from md file","Δεν γίνεται εισαγωγή":"Import not possible","Ρυθμίσεις":"Settings","Σχολείο & αρχείο δεδομένων":"School & data file","Δεδομένα":"Data","Τα δεδομένα αποθηκεύονται αυτόματα στον υπολογιστή:":"Data is saved automatically on the computer:","Μαζί κρατιούνται αντίγραφα ασφαλείας (φάκελος «αντίγραφα»). Οι ενημερώσεις της εφαρμογής δεν αγγίζουν αυτόν τον φάκελο.":"Backups are kept alongside (folder “αντίγραφα”). App updates do not touch this folder.","Άνοιγμα φακέλου":"Open folder","Δεν έχει επιλεγεί φάκελος — τα δεδομένα είναι μόνο προσωρινά στον browser.":"No folder chosen — data is only temporary in the browser.","Όταν βγει νέα έκδοση, απλώς αντικαθιστάς το αρχείο Ωρολόγιο.html. Ο φάκελος δεδομένων μένει ανέγγιχτος και η νέα έκδοση αναβαθμίζει μόνη της τα δεδομένα.":"When a new version comes out, just replace the Ωρολόγιο.html file. The data folder is untouched and the new version upgrades the data by itself.","Αλλαγή φακέλου":"Change folder","Εξαγωγή αντιγράφου (.json)":"Export backup (.json)","Εισαγωγή από αρχείο…":"Import from file…","Εισαγωγή εκπαιδευτικών (md)":"Import teachers (md)","Εξαγωγή εκπαιδευτικών (md)":"Export teachers (md)","Σχολείο":"School","Όνομα σχολείου (κεφαλίδα εκτύπωσης)":"School name (print header)","π.χ. 1ο ΓΕΝΙΚΟ ΛΥΚΕΙΟ …":"e.g. RIVERSIDE HIGH SCHOOL …","Αλλαγή":"Change","Τίτλος εκτύπωσης":"Print title","Μαθητές":"Students","Συνεχόμενες ώρες για τους μαθητές":"Consecutive periods for students","Κάθε τμήμα ξεκινά 1η ώρα και δεν έχει κενά· οι ελεύθερες ώρες μένουν στο τέλος της ημέρας.":"Each class starts at period 1 and has no gaps; free periods stay at the end of the day.","Ισοκατανομή των ελεύθερων ωρών":"Even spread of free periods","Π.χ. 32 ώρες → 7·7·6·6·6 (όχι 7·7·7·7·4).":"E.g. 32 periods → 7·7·6·6·6 (not 7·7·7·7·4).","Οι παράλληλες ομάδες (ίδια ετικέτα) μετρούν χωριστά: π.χ. οι μαθητές του Γ1 που είναι στο Γαν και όσοι είναι στο Γθετ πρέπει όλοι να έχουν συνεχόμενες ώρες.":"Parallel groups count separately: e.g. the students of C1 in one track and those in another must all have consecutive periods.","Ομαλή κατανομή ωρών μέσα στην εβδομάδα":"Even spread of periods across the week","Προσπάθεια (όχι κανόνας): να μην έχει κάποιος 2 ώρες τη μία μέρα και 6 την άλλη, π.χ. 4·4·4·5·4 αντί για 2·6·5·3·5.":"Effort (not a rule): avoid 2 periods one day and 6 the next, e.g. 4·4·4·5·4 instead of 2·6·5·3·5.","Ίσα κενά για όλους":"Equal gaps for everyone","Προσ ση. Για αυτές δεν υπάρχει ώρα όπου να είναι ελεύθεροι μαζί ο εκπαιδευτικός και οι μαθητές, χωρίς να σπάσει κάποιος αυστηρός κανόνας (κωλύματα, ζώνες, «ταυτόχρονα», μαθητές χωρίς κενά).":"Toutes les autres heures ont été placées sans conflit. Pour celles-ci, il n’existe aucun créneau où l’enseignant et les élèves sont libres ensemble sans enfreindre une règle stricte (indisponibilités, zones, « simultanés », élèves sans trous).","Θα τις βρεις δεξιά, στο «Χωρίς θέση». Μπορείς να τις σύρεις με το χέρι, ή να αλλάξεις ένα κώλυμα / τη ζώνη και να ξανατρέξεις την αυτόματη συμπλήρωση.":"Tu les trouveras à droite, dans « Non placées ». Tu peux les glisser à la main, ou modifier une indisponibilité / la zone et relancer le remplissage automatique.","Δεν βρέθηκε λύση που να τηρεί όλους τους κανόνες":"Aucune solution ne respecte toutes les règles","Οι αυστηροί κανόνες συγκρούονται μεταξύ τους.":"Les règles strictes se contredisent.","Ναι, δείξε την καλύτερη δυνατή":"Oui, montrer la meilleure possible","Ο/Η Διευθυντής/ντρια":"Le directeur / La directrice","κατ.":"fil.","ΤΜΗΜΑ":"CLASSE","Ωρολόγιο πρόγραμμα Τμημάτων":"Emploi du temps des classes","1 σελίδα A4 οριζόντια":"1 page A4 paysage","π.χ. 2/11/2026":"ex. 2/11/2026","Δημιουργία PDF…":"Création du PDF…","Δεν δημιουργήθηκε PDF.":"Aucun PDF créé.","Κρατήθηκε αντίγραφο στον φάκελο «εκτυπώσεις».":"Une copie a été gardée dans le dossier « εκτυπώσεις ».","Προεπισκόπηση εκτύπωσης":"Aperçu avant impression","Ισχύει από":"En vigueur depuis","Κάθε PDF κρατιέται στο Έγγραφα › Ωρολόγιο › εκτυπώσεις (με ημερομηνία) και ανοίγει για εκτύπωση.":"Chaque PDF est gardé dans Documents › Ωρολόγιο › σχολεία › … › εκτυπώσεις (avec la date) et s’ouvre pour l’impression.","Στο παράθυρο του browser διάλεξε εκτυπωτή ή «Αποθήκευση ως PDF».":"Dans la fenêtre du navigateur, choisis une imprimante ou « Enregistrer en PDF ».","Όχι, πίσω":"Non, retour","Ναι, δημιουργία PDF":"Oui, créer le PDF","Ναι, εκτύπωση":"Oui, imprimer","Γράψε τουλάχιστον το επώνυμο.":" ":"nouveau","Γράψε όνομα τμήματος.":"Écris un nom de classe.","Διάλεξε σε ποια τμήματα χρεώνεται το μικτό τμήμα.":"Choisis à quelles classes le groupe mixte est rattaché.","χωρίς όνομα":"sans nom","χωρίς ώρες ακόμα":"pas encore d’heures","χωρίς μαθήματα":"aucun cours"," · χρειάζεται διόρθωση":" · à corriger","χωρίς τμήματα":"aucune classe"," · άνισες ώρες":" · heures inégales","Νέο τμήμα":"Nouvelle classe","Γρήγορα Α1–Γ3":"Rapide A1–C3","Τμήματα που κάνουν μάθημα την ίδια ώρα (π.χ. ξένες γλώσσες, Κόντρα)":"Classes qui ont cours en même temps (ex. langues étrangères)","Μαθήματα που γίνονται ταυτόχρονα":"Cours simultanés","Ώρες της εβδομάδας όπου γίνονται μόνο ορισμένα μαθήματα":"Heures de la semaine réservées à certains cours","Ζώνες":"Zones","Διαγραφή ζώνης":"Supprimer la zone","Κανένα τμήμα ακόμα":"Aucune classe pour l’instant","Γρήγορη δημιουργία Α1–Γ3":"Création rapide A1–C3","Ξεκίνα με τα τμήματα (Α1, Α2…). Μετά φτιάξε τα μικτά τμήματα (π.χ. ξένες γλώσσες, μαθήματα επιλογής) και δήλωσε ποια γίνονται ταυτόχρονα.":"Commence par les classes (A1, A2…). Puis crée les groupes mixtes (ex. langues, options) et indique lesquels ont lieu en même temps.","π.χ. ΑΓαλ, ΑΓερμ2, ΓΘετ":"ex. A-ALL, A-ESP2, C-SCI","π.χ. Α1":"ex. A1","Όνομα (όπως το λέτε στο σχολείο — έτσι γράφεται και στο md)":"Nom (comme à l’école — aussi dans le md)","Είδος":"Type","Είδος τμήματος":"Type de classe","Κανονικό τμήμα":"Classe normale","Καλύτερα χωρίς κενά στο όνομα (π.χ. «ΓΕΡΜ-Α» αντί για «ΓΕΡΜ Α»).":"Mieux vaut un nom sans espaces (ex. « ALL-A » au lieu de « ALL A »)."," ανάθεση":" affectation"," αναθέσεις":" affectations","Ώρες μαθητών την εβδομάδα (μαζί με τα μικτά τμήματα που χρεώνονται εδώ)":"Heures des élèves par semaine (avec les groupes mixtes rattachés ici)"," — περισσότερες από όσες χωρούν!":" — plus que possible !","Χρεώνεται στα τμήματα":"Rattaché aux classes","Φτιάξε πρώτα τα κανονικά τμήματα.":"Crée d’abord les classes normales.","ή σε μικτά τμήματα (π.χ. «Κόντρα» που χρεώνεται σε μάθημα κατεύθυνσης Γ΄)":"ou à des groupes mixtes (ex. un groupe rattaché à un cours de filière)","Οι ώρες του μετράνε στις ώρες αυτών των τμημάτων, και δεν μπαίνει ποτέ την ίδια ώρα με άλλο μάθημά τους.":"Ses heures comptent dans celles de ces classes, et il n’a jamais lieu en même temps qu’un autre de leurs cours.","Ταυτόχρονα / ζώνη":"Simultané / zone","Ζώνη: ":"Zone : ","Δεν ανήκει σε ομάδα «ταυτόχρονα» ούτε σε ζώνη.":"N’appartient à aucun groupe « simultané » ni à une zone.","Αν γίνεται την ίδια ώρα με άλλα τμήματα (π.χ. ΑΓαλ με ΑΓερμ), δήλωσέ το με «Μαθήματα που γίνονται ταυτόχρονα» στη λίστα αριστερά.":"S’il a lieu en même temps que d’autres classes (ex. deux groupes de langues), indique-le avec « Cours simultanés » dans la liste à gauche.","Διάλεξε σε ποια τμήματα χρεώνεται — χωρίς αυτό το μικτό τμήμα δεν αποθηκεύεται.":"Choisis les classes de rattachement — sinon le groupe mixte n’est pas enregistré."," — οι ώρες πρέπει να είναι ίσες.":" — les heures doivent être égales.","π.χ. Κατεύθυνση Γ΄":"ex. Filières de terminale","ώρα της ζώνης":"heure de zone","όχι":"non","Όνομα ζώνης":"Nom de la zone","Ώρες της ζώνης":"Heures de la zone","Κλικ σε ώρα για να μπει/βγει. Μπορείς να τις ορίσεις και αργότερα.":"Clique sur une heure pour l’ajouter/la retirer. Tu peux aussi le faire plus tard.","Μαθήματα ζώνης":"Cours de la zone","Φτιάξε πρώτα τα μικτά τμήματα (π.χ. ΓΘετ, ΓΑνθ).":"Crée d’abord les groupes mixtes.","Τα μαθήματα της ζώνης γίνονται ταυτόχρονα (κάθε μαθητής σε ένα από αυτά) και μόνο μέσα στις ώρες της. Μέσα στη ζώνη δεν μπαίνει κανένα άλλο μάθημα των ίδιων τμημάτων (της ίδιας τάξης) — π.χ. γενική παιδεία.":"Les cours de la zone ont lieu en même temps (chaque élève dans l’un d’eux) et seulement pendant ses heures. Aucun autre cours des mêmes classes (même niveau) n’est placé dans la zone — ex. le tronc commun.","Η ζώνη είναι σωστή. Η αυτόματη συμπλήρωση θα βάλει τα μαθήματά της μόνο μέσα σε αυτήν.":"La zone est correcte. Le remplissage automatique placera ses cours uniquement dedans.","Καθαρισμός ωρών":"Effacer les heures","Γράψε όνομα ζώνης.":"Écris un nom de zone.","Κλικ στις ώρες της ζώνης και διάλεξε τα μαθήματά της.":"Clique sur les heures de la zone et choisis ses cours.","Νέα ζώνη":"Nouvelle zone","Ζώνη = ώρες της εβδομάδας όπου γίνονται μόνο ορισμένα μαθήματα (π.χ. τα μαθήματα κατεύθυνσης της Γ΄). Μέσα στη ζώνη δεν μπαίνει άλλο μάθημα της ίδιας τάξης.":"Zone = heures de la semaine où n’ont lieu que certains cours (ex. les filières de terminale). Aucun autre cours du même niveau n’est placé dans la zone.","Ώρες αργότερα":"Heures plus tard","Ορισμός ωρών τώρα":"Définir les heures maintenant","π.χ. Ξένες γλώσσες Α΄, Κόντρα":"ex. Langues étrangères A","Μόνο έως ώρα":"Seulement jusqu’à l’heure","οποιαδήποτε ώρα":"n’importe quelle heure","Όνομα (το γράφεις εσύ)":"Nom (à toi de l’écrire)","Τμήματα που κάνουν μάθημα την ίδια ώρα":"Classes qui ont cours en même temps","Κανονικά τμήματα":"Classes normales","Πότε":"Quand","Χωριστές γραμμές στην εκτύπωση":"Lignes séparées à l’impression","Στη σελίδα τμημάτων κάθε μικτό τμήμα της ομάδας παίρνει δική του γραμμή (π.χ. κατευθύνσεις).":"Sur la page des classes, chaque groupe mixte obtient sa propre ligne (ex. filières).","Με ένα μόνο τμήμα η ομάδα δεν έχει ακόμα αποτέλεσμα — πρόσθεσε τα υπόλοιπα όταν τα φτιάξεις.":"Avec une seule classe, le groupe n’a pas encore d’effet — ajoute les autres une fois créées."," — για να γίνονται μαζί πρέπει να έχουν τις ίδιες ώρες.":" — pour avoir lieu ensemble, elles doivent avoir les mêmes heures.","Οδηγία: ":"Remarque : ","Τα τμήματα μιας ομάδας κάνουν μάθημα πάντα την ίδια ώρα (π.χ. ΑΓαλ και ΑΓερμ). ":"Les classes d’un groupe ont toujours cours en même temps (ex. deux groupes de langues). ","Αν ένα τμήμα χωρίζεται στη μέση και τα δύο μισά κάνουν διαφορετικό μάθημα, δήλωσε τα μισά ως χωριστά μικτά τμήματα με διαφορετικό όνομα (π.χ. Β1α και Β1β, χρεωμένα στο Β1) και βάλε τα εδώ μαζί.":"Si une classe se divise en deux et que les deux moitiés ont des cours différents, déclare les moitiés comme groupes mixtes distincts avec des noms différents (ex. B1a et B1b, rattachés à B1) et mets-les ensemble ici.","Γράψε όνομα (π.χ. «Ξένες γλώσσες Α΄»).":"Écris un nom (ex. « Langues étrangères A »).","Διάλεξε τα τμήματα.":"Choisis les classes.","Γράψε τα κανονικά τμήματα όπως ονομάζονται στο σχολείο σας (π.χ. Α1, Α2). Οι αλλαγές ονομάτων περνούν παντού — αναθέσεις, μικτά τμήματα, εκτύπωση. Τα μικτά τμήματα (ΑΓαλ κ.λπ.) φτιάχνονται με «+ Μικτό τμήμα».":"Écris les classes normales comme elles sont nommées dans ton école (ex. A1, A2). Les changements de nom s’appliquent partout — affectations, groupes mixtes, impression. Les groupes mixtes se créent avec « + Groupe mixte ».","Όνομα τμήματος":"Nom de la classe","Αναίρεση διαγραφής":"Annuler la suppression","Προσθήκη τμήματος":"Ajouter une classe","Οι ονομασίες αποθηκεύτηκαν.":"Noms enregistrés.","Διαγραφή τμημάτων":"Supprimer des classes","Ονομασίες τμημάτων του σχολείου":"Noms des classes de l’école","Γρήγορη δημιουργία τμημάτων":"Création rapide de classes","Όσα υπάρχουν ήδη με το ίδιο όνομα δεν ξαναδημιουργούνται.":"Celles qui existent déjà avec le même nom ne sont pas recréées.","Δημιουργία":"Créer","# Μορφή: Επώνυμο Όνομα, Ειδικότητα, τμήματα (κόμμα = άλλη μέρα · Α1Α1 = δίωρο · Α1Α1Α1 = τρίωρο)":"# Format : Nom Prénom, Spécialité, classes (virgule = autre jour · A1A1 = double · A1A1A1 = triple)","Εκπαιδευτικοί.md":"Enseignants.md","Πρώτα τα τμήματα":"D’abord les classes","Δεν έχουν οριστεί τμήματα στην εφαρμογή.":"Aucune classe n’est définie dans l’application.","Φτιάξε πρώτα όλα τα τμήματα του σχολείου (κανονικά και μικτά) στη σελίδα «Τμήματα» και μετά κάνε την εισαγωγή.":"Crée d’abord toutes les classes de l’école (normales et mixtes) dans la page « Classes », puis importe.","Λείπει το ονοματεπώνυμο στην αρχή της γραμμής.":"Le nom complet manque au début de la ligne.","Το αρχείο δεν έχει γραμμές εκπαιδευτικών.":"Le fichier ne contient aucune ligne d’enseignant.","Νέος":"Nouveau","Ίδιος":"Identique","Αλλαγές":"Modifications"," εκπαιδευτικοί στο αρχείο":" enseignants dans le fichier"," νέοι":" nouveaux"," υπάρχουν ήδη":" existent déjà"," γραμμές δεν διαβάστηκαν":" lignes illisibles","Η εισαγωγή δεν μπορεί να γίνει. ":"L’import est impossible. ","Αυτά τα τμήματα δεν έχουν οριστεί στην εφαρμογή: ":"Ces classes ne sont pas définies dans l’application : ","Μικτά τμήματα χωρίς «Χρεώνεται στα τμήματα»: ":"Groupes mixtes sans « Rattaché aux classes » : ","Φτιάξ' τα (ή διόρθωσέ τα) στη σελίδα «Τμήματα», με ακριβώς το ίδιο όνομα, και ξαναδοκίμασε.":"Crée-les (ou corrige-les) dans la page « Classes », avec exactement le même nom, puis réessaie.","Γραμμή":"Ligne","Τμήματα (κομμάτια)":"Classes (blocs)","Κατάσταση":"État","Για όσους υπάρχουν ήδη: ενημερώνονται η ειδικότητα και οι αναθέσεις. Κανόνες που έχεις βάλει σε μια ανάθεση (π.χ. «έως 5η ώρα») μένουν, αν το τμήμα υπάρχει ακόμα στη γραμμή. Κρατιέται αντίγραφο ασφαλείας πριν την εισαγωγή.":"Pour les enseignants existants : la spécialité et les affectations sont mises à jour. Les règles d’une affectation (ex. « jusqu’à la 5e heure ») restent si la classe est encore sur la ligne. Une sauvegarde est faite avant l’import.","Εισαγωγή από αρχείο md":"Importer depuis un fichier md","Δεν γίνεται εισαγωγή":"Import impossible","Ρυθμίσεις":"Réglages","Σχολείο & αρχείο δεδομένων":"École & fichier de données","Δεδομένα":"Données","Τα δεδομένα αποθηκεύονται αυτόματα στον υπολογιστή:":"Les données sont enregistrées automatiquement sur l’ordinateur :","Μαζί κρατιούνται αντίγραφα ασφαλείας (φάκελος «αντίγραφα»). Οι ενημερώσεις της εφαρμογής δεν αγγίζουν αυτόν τον φάκελο.":"Des sauvegardes sont conservées à côté (dossier « αντίγραφα »). Les mises à jour ne touchent pas ce dossier.","Άνοιγμα φακέλου":"Ouvrir le dossier","Δεν έχει επιλεγεί φάκελος — τα δεδομένα είναι μόνο προσωρινά στον browser.":"Aucun dossier choisi — les données sont seulement temporaires dans le navigateur.","Όταν βγει νέα έκδοση, απλώς αντικαθιστάς το αρχείο Ωρολόγιο.html. Ο φάκελος δεδομένων μένει ανέγγιχτος και η νέα έκδοση αναβαθμίζει μόνη της τα δεδομένα.":"Quand une nouvelle version sort, remplace simplement le fichier Ωρολόγιο.html. Le dossier de données n’est pas touché et la nouvelle version met à jour les données toute seule.","Αλλαγή φακέλου":"Changer de dossier","Εξαγωγή αντιγράφου (.json)":"Exporter une sauvegarde (.json)","Εισαγωγή από αρχείο…":"Importer depuis un fichier…","Εισαγωγή εκπαιδευτικών (md)":"Importer des enseignants (md)","Εξαγωγή εκπαιδευτικών (md)":"Exporter les enseignants (md)","Σχολείο":"École","Όνομα σχολείου (κεφαλίδα εκτύπωσης)":"Nom de l’école (en-tête d’impression)","π.χ. 1ο ΓΕΝΙΚΟ ΛΥΚΕΙΟ …":"ex. LYCÉE JEAN MOULIN …","Αλλαγή":"Modifier","Τίτλος εκτύπωσης":"Titre d’impression","Μαθητές":"Élèves","Συνεχόμενες ώρες για τους μαθητές":"Heures consécutives pour les élèves","Κάθε τμήμα ξεκινά 1η ώρα και δεν έχει κενά· οι ελεύθερες ώρες μένουν στο τέλος της ημέρας.":"Chaque classe commence à la 1re heure sans trous ; les heures libres sont en fin de journée.","Ισοκατανομή των ελεύθερων ωρών":"Répartition équilibrée des heures libres","Π.χ. 32 ώρες → 7·7·6·6·6 (όχι 7·7·7·7·4).":"Ex. 32 heures → 7·7·6·6·6 (et non 7·7·7·7·4).","Οι παράλληλες ομάδες (ίδια ετικέτα) μετρούν χωριστά: π.χ. οι μαθητές του Γ1 που είναι στο Γαν και όσοι είναι στο Γθετ πρέπει όλοι να έχουν συνεχόμενες ώρες.":"Les groupes parallèles comptent séparément : ex. les élèves de C1 dans une filière et ceux d’une autre doivent tous avoir des heures consécutives.","Ομαλή κατανομή ωρών μέσα στην εβδομάδα":"Répartition équilibrée des heures dans la semaine","Προσπάθεια (όχι κανόνας): να μην έχει κάποιος 2 ώρες τη μία μέρα και 6 την άλλη, π.χ. 4·4·4·5·4 αντί για 2·6·5·3·5.":"Effort (pas une règle) : éviter 2 heures un jour et 6 le lendemain, ex. 4·4·4·5·4 au lieu de 2·6·5·3·5.","Ίσα κενά για όλους":"Trous équitables pour tous","Προσπάθεια (όχι κανόνας): αν χρειαστούν κενά, να μοιράζονται — π.χ. ένα στον καθένα αντί γι eordnet ist)","Οι ώρες του μετράνε στις ώρες αυτών των τμημάτων, και δεν μπαίνει ποτέ την ίδια ώρα με άλλο μάθημά τους.":"Ihre Stunden zählen zu den Stunden dieser Klassen und liegen nie gleichzeitig mit einer anderen Stunde dieser Klassen.","Ταυτόχρονα / ζώνη":"Gleichzeitig / Zone","Ζώνη: ":"Zone: ","Δεν ανήκει σε ομάδα «ταυτόχρονα» ούτε σε ζώνη.":"Gehört zu keiner „gleichzeitig“-Gruppe und keiner Zone.","Αν γίνεται την ίδια ώρα με άλλα τμήματα (π.χ. ΑΓαλ με ΑΓερμ), δήλωσέ το με «Μαθήματα που γίνονται ταυτόχρονα» στη λίστα αριστερά.":"Wenn es gleichzeitig mit anderen Klassen stattfindet (z. B. zwei Sprachgruppen), gib es mit „Gleichzeitige Kurse“ in der Liste links an.","Διάλεξε σε ποια τμήματα χρεώνεται — χωρίς αυτό το μικτό τμήμα δεν αποθηκεύεται.":"Wähle die zugeordneten Klassen — sonst wird die Mischgruppe nicht gespeichert."," — οι ώρες πρέπει να είναι ίσες.":" — die Stunden müssen gleich sein.","π.χ. Κατεύθυνση Γ΄":"z. B. Profilkurse Jahrgang C","ώρα της ζώνης":"Zonenstunde","όχι":"nein","Όνομα ζώνης":"Name der Zone","Ώρες της ζώνης":"Stunden der Zone","Κλικ σε ώρα για να μπει/βγει. Μπορείς να τις ορίσεις και αργότερα.":"Klicke auf eine Stunde, um sie hinzuzufügen/zu entfernen. Du kannst sie auch später festlegen.","Μαθήματα ζώνης":"Kurse der Zone","Φτιάξε πρώτα τα μικτά τμήματα (π.χ. ΓΘετ, ΓΑνθ).":"Lege zuerst die Mischgruppen an.","Τα μαθήματα της ζώνης γίνονται ταυτόχρονα (κάθε μαθητής σε ένα από αυτά) και μόνο μέσα στις ώρες της. Μέσα στη ζώνη δεν μπαίνει κανένα άλλο μάθημα των ίδιων τμημάτων (της ίδιας τάξης) — π.χ. γενική παιδεία.":"Die Kurse der Zone finden gleichzeitig statt (jeder Schüler in einem davon) und nur in ihren Stunden. In der Zone liegt keine andere Stunde derselben Klassen (desselben Jahrgangs) — z. B. Pflichtfächer.","Η ζώνη είναι σωστή. Η αυτόματη συμπλήρωση θα βάλει τα μαθήματά της μόνο μέσα σε αυτήν.":"Die Zone ist korrekt. Automatisches Füllen setzt ihre Kurse nur innerhalb.","Καθαρισμός ωρών":"Stunden leeren","Γράψε όνομα ζώνης.":"Gib einen Namen für die Zone ein.","Κλικ στις ώρες της ζώνης και διάλεξε τα μαθήματά της.":"Klicke auf die Stunden der Zone und wähle ihre Kurse.","Νέα ζώνη":"Neue Zone","Ζώνη = ώρες της εβδομάδας όπου γίνονται μόνο ορισμένα μαθήματα (π.χ. τα μαθήματα κατεύθυνσης της Γ΄). Μέσα στη ζώνη δεν μπαίνει άλλο μάθημα της ίδιας τάξης.":"Zone = Stunden der Woche, in denen nur bestimmte Kurse stattfinden (z. B. Profilkurse des Abschlussjahrgangs). In der Zone liegt keine andere Stunde desselben Jahrgangs.","Ώρες αργότερα":"Stunden später","Ορισμός ωρών τώρα":"Stunden jetzt festlegen","π.χ. Ξένες γλώσσες Α΄, Κόντρα":"z. B. Fremdsprachen A","Μόνο έως ώρα":"Nur bis Stunde","οποιαδήποτε ώρα":"jede Stunde","Όνομα (το γράφεις εσύ)":"Name (frei wählbar)","Τμήματα που κάνουν μάθημα την ίδια ώρα":"Klassen mit Unterricht zur selben Zeit","Κανονικά τμήματα":"Normale Klassen","Πότε":"Wann","Χωριστές γραμμές στην εκτύπωση":"Eigene Zeilen im Druck","Στη σελίδα τμημάτων κάθε μικτό τμήμα της ομάδας παίρνει δική του γραμμή (π.χ. κατευθύνσεις).":"Auf der Klassenseite bekommt jede Mischgruppe eine eigene Zeile (z. B. Profile).","Με ένα μόνο τμήμα η ομάδα δεν έχει ακόμα αποτέλεσμα — πρόσθεσε τα υπόλοιπα όταν τα φτιάξεις.":"Mit nur einer Klasse hat die Gruppe noch keine Wirkung — füge die anderen hinzu, sobald es sie gibt."," — για να γίνονται μαζί πρέπει να έχουν τις ίδιες ώρες.":" — um zusammen stattzufinden, brauchen sie gleich viele Stunden.","Οδηγία: ":"Hinweis: ","Τα τμήματα μιας ομάδας κάνουν μάθημα πάντα την ίδια ώρα (π.χ. ΑΓαλ και ΑΓερμ). ":"Die Klassen einer Gruppe haben immer gleichzeitig Unterricht (z. B. zwei Sprachgruppen). ","Αν ένα τμήμα χωρίζεται στη μέση και τα δύο μισά κάνουν διαφορετικό μάθημα, δήλωσε τα μισά ως χωριστά μικτά τμήματα με διαφορετικό όνομα (π.χ. Β1α και Β1β, χρεωμένα στο Β1) και βάλε τα εδώ μαζί.":"Wenn sich eine Klasse teilt und die Hälften unterschiedlichen Unterricht haben, lege die Hälften als eigene Mischgruppen mit verschiedenen Namen an (z. B. B1a und B1b, zugeordnet zu B1) und nimm sie hier zusammen auf.","Γράψε όνομα (π.χ. «Ξένες γλώσσες Α΄»).":"Gib einen Namen ein (z. B. „Fremdsprachen A“).","Διάλεξε τα τμήματα.":"Wähle die Klassen.","Γράψε τα κανονικά τμήματα όπως ονομάζονται στο σχολείο σας (π.χ. Α1, Α2). Οι αλλαγές ονομάτων περνούν παντού — αναθέσεις, μικτά τμήματα, εκτύπωση. Τα μικτά τμήματα (ΑΓαλ κ.λπ.) φτιάχνονται με «+ Μικτό τμήμα».":"Schreibe die normalen Klassen so, wie sie an deiner Schule heißen (z. B. A1, A2). Umbenennungen gelten überall — Zuweisungen, Mischgruppen, Druck. Mischgruppen legst du mit „+ Mischgruppe“ an.","Όνομα τμήματος":"Klassenname","Αναίρεση διαγραφής":"Löschen rückgängig","Προσθήκη τμήματος":"Klasse hinzufügen","Οι ονομασίες αποθηκεύτηκαν.":"Namen gespeichert.","Διαγραφή τμημάτων":"Klassen löschen","Ονομασίες τμημάτων του σχολείου":"Klassennamen der Schule","Γρήγορη δημιουργία τμημάτων":"Klassen schnell anlegen","Όσα υπάρχουν ήδη με το ίδιο όνομα δεν ξαναδημιουργούνται.":"Bereits vorhandene mit gleichem Namen werden nicht erneut angelegt.","Δημιουργία":"Anlegen","# Μορφή: Επώνυμο Όνομα, Ειδικότητα, τμήματα (κόμμα = άλλη μέρα · Α1Α1 = δίωρο · Α1Α1Α1 = τρίωρο)":"# Format: Nachname Vorname, Fach, Klassen (Komma = anderer Tag · A1A1 = Doppel · A1A1A1 = Dreifach)","Εκπαιδευτικοί.md":"Lehrkräfte.md","Πρώτα τα τμήματα":"Zuerst die Klassen","Δεν έχουν οριστεί τμήματα στην εφαρμογή.":"In der App sind keine Klassen angelegt.","Φτιάξε πρώτα όλα τα τμήματα του σχολείου (κανονικά και μικτά) στη σελίδα «Τμήματα» και μετά κάνε την εισαγωγή.":"Lege zuerst alle Klassen der Schule (normale und Mischgruppen) auf der Seite „Klassen“ an und importiere dann.","Λείπει το ονοματεπώνυμο στην αρχή της γραμμής.":"Der Name fehlt am Zeilenanfang.","Το αρχείο δεν έχει γραμμές εκπαιδευτικών.":"Die Datei enthält keine Lehrkraft-Zeilen.","Νέος":"Neu","Ίδιος":"Gleich","Αλλαγές":"Änderungen"," εκπαιδευτικοί στο αρχείο":" Lehrkräfte in der Datei"," νέοι":" neu"," υπάρχουν ήδη":" schon vorhanden"," γραμμές δεν διαβάστηκαν":" Zeilen nicht lesbar","Η εισαγωγή δεν μπορεί να γίνει. ":"Der Import ist nicht möglich. ","Αυτά τα τμήματα δεν έχουν οριστεί στην εφαρμογή: ":"Diese Klassen sind in der App nicht angelegt: ","Μικτά τμήματα χωρίς «Χρεώνεται στα τμήματα»: ":"Mischgruppen ohne „Zugeordnet zu den Klassen“: ","Φτιάξ' τα (ή διόρθωσέ τα) στη σελίδα «Τμήματα», με ακριβώς το ίδιο όνομα, και ξαναδοκίμασε.":"Lege sie auf der Seite „Klassen“ an (oder korrigiere sie), mit genau demselben Namen, und versuche es erneut.","Γραμμή":"Zeile","Τμήματα (κομμάτια)":"Klassen (Blöcke)","Κατάσταση":"Status","Για όσους υπάρχουν ήδη: ενημερώνονται η ειδικότητα και οι αναθέσεις. Κανόνες που έχεις βάλει σε μια ανάθεση (π.χ. «έως 5η ώρα») μένουν, αν το τμήμα υπάρχει ακόμα στη γραμμή. Κρατιέται αντίγραφο ασφαλείας πριν την εισαγωγή.":"Für vorhandene Lehrkräfte werden Fach und Zuweisungen aktualisiert. Regeln einer Zuweisung (z. B. „bis zur 5. Stunde“) bleiben, wenn die Klasse noch in der Zeile steht. Vor dem Import wird eine Sicherung angelegt.","Εισαγωγή από αρχείο md":"Aus md-Datei importieren","Δεν γίνεται εισαγωγή":"Import nicht möglich","Ρυθμίσεις":"Einstellungen","Σχολείο & αρχείο δεδομένων":"Schule & Datendatei","Δεδομένα":"Daten","Τα δεδομένα αποθηκεύονται αυτόματα στον υπολογιστή:":"Die Daten werden automatisch auf dem Computer gespeichert:","Μαζί κρατιούνται αντίγραφα ασφαλείας (φάκελος «αντίγραφα»). Οι ενημερώσεις της εφαρμογής δεν αγγίζουν αυτόν τον φάκελο.":"Daneben werden Sicherungen aufbewahrt (Ordner „αντίγραφα“). Updates der App verändern diesen Ordner nicht.","Άνοιγμα φακέλου":"Ordner öffnen","Δεν έχει επιλεγεί φάκελος — τα δεδομένα είναι μόνο προσωρινά στον browser.":"Kein Ordner gewählt — die Daten sind nur vorübergehend im Browser.","Όταν βγει νέα έκδοση, απλώς αντικαθιστάς το αρχείο Ωρολόγιο.html. Ο φάκελος δεδομένων μένει ανέγγιχτος και η νέα έκδοση αναβαθμίζει μόνη της τα δεδομένα.":"Bei einer neuen Version ersetzt du einfach die Datei Ωρολόγιο.html. Der Datenordner bleibt unverändert o normal","Καλύτερα χωρίς κενά στο όνομα (π.χ. «ΓΕΡΜ-Α» αντί για «ΓΕΡΜ Α»).":"Mejor sin espacios en el nombre (p. ej. «ALE-A» en vez de «ALE A»)."," ανάθεση":" asignación"," αναθέσεις":" asignaciones","Ώρες μαθητών την εβδομάδα (μαζί με τα μικτά τμήματα που χρεώνονται εδώ)":"Horas de los alumnos por semana (con los grupos mixtos asignados aquí)"," — περισσότερες από όσες χωρούν!":" — ¡más de las que caben!","Χρεώνεται στα τμήματα":"Asignado a los grupos","Φτιάξε πρώτα τα κανονικά τμήματα.":"Crea primero los grupos normales.","ή σε μικτά τμήματα (π.χ. «Κόντρα» που χρεώνεται σε μάθημα κατεύθυνσης Γ΄)":"o a grupos mixtos (p. ej. un grupo asignado a una materia de itinerario)","Οι ώρες του μετράνε στις ώρες αυτών των τμημάτων, και δεν μπαίνει ποτέ την ίδια ώρα με άλλο μάθημά τους.":"Sus horas cuentan en las de estos grupos y nunca coincide con otra de sus clases.","Ταυτόχρονα / ζώνη":"Simultánea / zona","Ζώνη: ":"Zona: ","Δεν ανήκει σε ομάδα «ταυτόχρονα» ούτε σε ζώνη.":"No pertenece a ningún grupo «simultáneo» ni a ninguna zona.","Αν γίνεται την ίδια ώρα με άλλα τμήματα (π.χ. ΑΓαλ με ΑΓερμ), δήλωσέ το με «Μαθήματα που γίνονται ταυτόχρονα» στη λίστα αριστερά.":"Si va a la misma hora que otros grupos (p. ej. dos grupos de idiomas), indícalo con «Clases simultáneas» en la lista de la izquierda.","Διάλεξε σε ποια τμήματα χρεώνεται — χωρίς αυτό το μικτό τμήμα δεν αποθηκεύεται.":"Elige a qué grupos se asigna; sin esto el grupo mixto no se guarda."," — οι ώρες πρέπει να είναι ίσες.":" — las horas deben ser iguales.","π.χ. Κατεύθυνση Γ΄":"p. ej. Itinerarios de 2.º","ώρα της ζώνης":"hora de zona","όχι":"no","Όνομα ζώνης":"Nombre de la zona","Ώρες της ζώνης":"Horas de la zona","Κλικ σε ώρα για να μπει/βγει. Μπορείς να τις ορίσεις και αργότερα.":"Haz clic en una hora para añadirla/quitarla. También puedes definirlas más tarde.","Μαθήματα ζώνης":"Materias de la zona","Φτιάξε πρώτα τα μικτά τμήματα (π.χ. ΓΘετ, ΓΑνθ).":"Crea primero los grupos mixtos.","Τα μαθήματα της ζώνης γίνονται ταυτόχρονα (κάθε μαθητής σε ένα από αυτά) και μόνο μέσα στις ώρες της. Μέσα στη ζώνη δεν μπαίνει κανένα άλλο μάθημα των ίδιων τμημάτων (της ίδιας τάξης) — π.χ. γενική παιδεία.":"Las materias de la zona van a la vez (cada alumno en una de ellas) y solo dentro de sus horas. Dentro de la zona no se coloca ninguna otra clase de los mismos grupos (mismo curso), p. ej. materias comunes.","Η ζώνη είναι σωστή. Η αυτόματη συμπλήρωση θα βάλει τα μαθήματά της μόνο μέσα σε αυτήν.":"La zona es correcta. El rellenado automático colocará sus materias solo dentro de ella.","Καθαρισμός ωρών":"Borrar horas","Γράψε όνομα ζώνης.":"Escribe un nombre de zona.","Κλικ στις ώρες της ζώνης και διάλεξε τα μαθήματά της.":"Haz clic en las horas de la zona y elige sus materias.","Νέα ζώνη":"Nueva zona","Ζώνη = ώρες της εβδομάδας όπου γίνονται μόνο ορισμένα μαθήματα (π.χ. τα μαθήματα κατεύθυνσης της Γ΄). Μέσα στη ζώνη δεν μπαίνει άλλο μάθημα της ίδιας τάξης.":"Zona = horas de la semana en que solo se dan ciertas materias (p. ej. los itinerarios del último curso). Dentro de la zona no se coloca otra clase del mismo curso.","Ώρες αργότερα":"Horas más tarde","Ορισμός ωρών τώρα":"Definir horas ahora","π.χ. Ξένες γλώσσες Α΄, Κόντρα":"p. ej. Idiomas A","Μόνο έως ώρα":"Solo hasta la hora","οποιαδήποτε ώρα":"cualquier hora","Όνομα (το γράφεις εσύ)":"Nombre (lo escribes tú)","Τμήματα που κάνουν μάθημα την ίδια ώρα":"Grupos que tienen clase a la misma hora","Κανονικά τμήματα":"Grupos normales","Πότε":"Cuándo","Χωριστές γραμμές στην εκτύπωση":"Filas separadas en la impresión","Στη σελίδα τμημάτων κάθε μικτό τμήμα της ομάδας παίρνει δική του γραμμή (π.χ. κατευθύνσεις).":"En la página de grupos, cada grupo mixto tiene su propia fila (p. ej. itinerarios).","Με ένα μόνο τμήμα η ομάδα δεν έχει ακόμα αποτέλεσμα — πρόσθεσε τα υπόλοιπα όταν τα φτιάξεις.":"Con un solo grupo aún no tiene efecto: añade los demás cuando los crees."," — για να γίνονται μαζί πρέπει να έχουν τις ίδιες ώρες.":" — para ir juntas deben tener las mismas horas.","Οδηγία: ":"Nota: ","Τα τμήματα μιας ομάδας κάνουν μάθημα πάντα την ίδια ώρα (π.χ. ΑΓαλ και ΑΓερμ). ":"Los grupos de un conjunto siempre tienen clase a la misma hora (p. ej. dos grupos de idiomas). ","Αν ένα τμήμα χωρίζεται στη μέση και τα δύο μισά κάνουν διαφορετικό μάθημα, δήλωσε τα μισά ως χωριστά μικτά τμήματα με διαφορετικό όνομα (π.χ. Β1α και Β1β, χρεωμένα στο Β1) και βάλε τα εδώ μαζί.":"Si un grupo se divide en dos y las mitades tienen clases distintas, declara las mitades como grupos mixtos separados con nombres distintos (p. ej. B1a y B1b, asignados a B1) y ponlos juntos aquí.","Γράψε όνομα (π.χ. «Ξένες γλώσσες Α΄»).":"Escribe un nombre (p. ej. «Idiomas A»).","Διάλεξε τα τμήματα.":"Elige los grupos.","Γράψε τα κανονικά τμήματα όπως ονομάζονται στο σχολείο σας (π.χ. Α1, Α2). Οι αλλαγές ονομάτων περνούν παντού — αναθέσεις, μικτά τμήματα, εκτύπωση. Τα μικτά τμήματα (ΑΓαλ κ.λπ.) φτιάχνονται με «+ Μικτό τμήμα».":"Escribe los grupos normales como se llaman en tu centro (p. ej. A1, A2). Los cambios de nombre se aplican en todas partes: asignaciones, grupos mixtos, impresión. Los grupos mixtos se crean con «+ Grupo mixto».","Όνομα τμήματος":"Nombre del grupo","Αναίρεση διαγραφής":"Deshacer eliminación","Προσθήκη τμήματος":"Añadir grupo","Οι ονομασίες αποθηκεύτηκαν.":"Nombres guardados.","Διαγραφή τμημάτων":"Eliminar grupos","Ονομασίες τμημάτων του σχολείου":"Nombres de los grupos del centro","Γρήγορη δημιουργία τμημάτων":"Creación rápida de grupos","Όσα υπάρχουν ήδη με το ίδιο όνομα δεν ξαναδημιουργούνται.":"Los que ya existen con el mismo nombre no se vuelven a crear.","Δημιουργία":"Crear","# Μορφή: Επώνυμο Όνομα, Ειδικότητα, τμήματα (κόμμα = άλλη μέρα · Α1Α1 = δίωρο · Α1Α1Α1 = τρίωρο)":"# Formato: Apellido Nombre, Especialidad, grupos (coma = otro día · A1A1 = doble · A1A1A1 = triple)","Εκπαιδευτικοί.md":"Docentes.md","Πρώτα τα τμήματα":"Primero los grupos","Δεν έχουν οριστεί τμήματα στην εφαρμογή.":"No hay grupos definidos en la aplicación.","Φτιάξε πρώτα όλα τα τμήματα του σχολείου (κανονικά και μικτά) στη σελίδα «Τμήματα» και μετά κάνε την εισαγωγή.":"Crea primero todos los grupos del centro (normales y mixtos) en la página «Grupos» y luego importa.","Λείπει το ονοματεπώνυμο στην αρχή της γραμμής.":"Falta el nombre completo al principio de la línea.","Το αρχείο δεν έχει γραμμές εκπαιδευτικών.":"El archivo no tiene líneas de docentes.","Νέος":"Nuevo","Ίδιος":"Igual","Αλλαγές":"Cambios"," εκπαιδευτικοί στο αρχείο":" docentes en el archivo"," νέοι":" nuevos"," υπάρχουν ήδη":" ya existen"," γραμμές δεν διαβάστηκαν":" líneas no se pudieron leer","Η εισαγωγή δεν μπορεί να γίνει. ":"No se puede importar. ","Αυτά τα τμήματα δεν έχουν οριστεί στην εφαρμογή: ":"Estos grupos no están definidos en la aplicación: ","Μικτά τμήματα χωρίς «Χρεώνεται στα τμήματα»: ":"Grupos mixtos sin «Asignado a los grupos»: ","Φτιάξ' τα (ή διόρθωσέ τα) στη σελίδα «Τμήματα», με ακριβώς το ίδιο όνομα, και ξαναδοκίμασε.":"Créalos (o corrígelos) en la página «Grupos», con el mismo nombre exacto, y vuelve a intentarlo.","Γραμμή":"Línea","Τμήματα (κομμάτια)":"Grupos (bloques)","Κατάσταση":"Estado","Για όσους υπάρχουν ήδη: ενημερώνονται η ειδικότητα και οι αναθέσεις. Κανόνες που έχεις βάλει σε μια ανάθεση (π.χ. «έως 5η ώρα») μένουν, αν το τμήμα υπάρχει ακόμα στη γραμμή. Κρατιέται αντίγραφο ασφαλείας πριν την εισαγωγή.":"Para los docentes existentes se actualizan la especialidad y las asignaciones. Las reglas de una asignación (p. ej. «hasta la 5.ª hora») se mantienen si el grupo sigue en la línea. Antes de importar se guarda una copia.","Εισαγωγή από αρχείο md":"Importar desde archivo md","Δεν γίνεται εισαγωγή":"No se puede importar","Ρυθμίσεις":"Ajustes","Σχολείο & αρχείο δεδομένων":"Centro y archivo de datos","Δεδομένα":"Datos","Τα δεδομένα αποθηκεύονται αυτόματα στον υπολογιστή:":"Los datos se guardan automáticamente en el ordenador:","Μαζί κρατιούνται αντίγραφα ασφαλείας (φάκελος «αντίγραφα»). Οι ενημερώσεις της εφαρμογής δεν αγγίζουν αυτόν τον φάκελο.":"Junto a ellos se guardan copias (carpeta «αντίγραφα»). Las actualizaciones no tocan esta carpeta.","Άνοιγμα φακέλου":"Abrir carpeta","Δεν έχει επιλεγεί φάκελος — τα δεδομένα είναι μόνο προσωρινά στον browser.":"No se eligió carpeta: los datos son solo temporales en el navegador.","Όταν βγει νέα έκδοση, απλώς αντικαθιστάς το αρχείο Ωρολόγιο.html. Ο φάκελος δεδομένων μένει ανέγγιχτος και η νέα έκδοση αναβαθμίζει μόνη της τα δεδομένα.":"Cuando salga una versión nueva, basta con sustituir el archivo Ωρολόγιο.html. La carpeta de datos no se toca y la nueva versión actualiza los datos sola.","Αλλαγή φακέλου":"Cambiar carpeta","Εξαγωγή αντιγράφου (.json)":"Exportar copia (.json)","Εισαγωγή από αρχείο…":"Importar desde archivo…","Εισαγωγή εκπαιδευτικών (md)":"Importar docentes (md)","Εξαγωγή εκπαιδευτικών (md)":"Exportar docentes (md)","Σχολείο":"Centro","Όνομα σχολείου (κεφαλίδα εκτύπωσης)":"Nombre del centro (encabezado de impresión)","π.χ. 1ο ΓΕΝΙΚΟ ΛΥΚΕΙΟ …":"p. ej. IES CERVANTES …","Αλλαγή":"Cambiar","Τίτλος εκτύπωσης":"Título de impresión","Μαθητές":"Alumnos","Συνεχόμενες ώρες για τους μαθητές":"Horas seguidas para los alumnos","Κάθε τμήμα ξεκινά 1η ώρα και δεν έχει κενά· οι ελεύθερες ώρες μένουν στο τέλος της ημέρας.":"Cada grupo empieza a 1.ª hora y no tiene huecos; las horas libres quedan al final del día.","Ισοκατανομή των ελεύθερων ωρών":"Reparto equilibrado de las horas libres","Π.χ. 32 ώρες → 7·7·6·6·6 (όχι 7·7·7·7·4).":"P. ej. 32 horas → 7·7·6·6·6 (no 7·7·7·7·4).","Οι παράλληλες ομάδες (ίδια ετικέτα) μετρούν χωριστά: π.χ. οι μαθητές του Γ1 που είναι στο Γαν και όσοι είναι στο Γθετ πρέπει όλοι να έχουν συνεχόμενες ώρες.":"Los grupos paralelos cuentan por separado: p. ej. los alumnos de C1 de un itinerario y los de otro deben tener todos horas seguidas.","Ομαλή κατανομή ωρών μέσα στην εβδομάδα":"Reparto equilibrado de horas en la semana","Προσπάθεια (όχι κανόνας): να μην έχει κάποιος 2 ώρες τη μία μέρα και 6 την άλλη, π.χ. 4·4·4·5·4 αντί για 2·6·5·3·5.":"Intento (no regla): evitar 2 horas un día y 6 otro, p. ej. 4·4·4·5·4 en vez de 2·6·5·3·5.","Ίσα κενά για όλους":"Huecos equitativos para todos","Προσπάθεια (όχι κανόνας): αν χρειαστούν κενά, να μοιράζονται — π.χ. ένα στον καθένα αντί για τρία σε έναν.":"Intento (no regla): si hacen falta huecos, repartirlos, p. ej. uno a cada uno en vez de tres a una persona.","Τα κενά ελαχιστοποιούνται πάντα όσο γίνεται. Όριο κενών (αυστηρό ή στόχο) βάζεις στην καρτέλα κάθε εκπαιδευτικού· χωρίς όριο, μπορεί να προκύψει κενό αν δεν γίνεται αλλιώς.":"Los huecos siempre se reducen al mínimo posible. El límite de huecos (estricto u objetivo) se pone en la ficha de cada docente; sin límite, puede aparecer un hueco si no hay otra forma.","Προεπιλεγμένος χρόνος αναζήτησης":"Tiempo de búsqueda predeterminado","Google OR-Tools (εφαρμογή .pyw)":"Google OR-Tools (aplicación .pyw)","Νέα αρχή":"Empezar de cero","Σβήνει όλους τους εκπαιδευτικούς, τμήματα, αναθέσεις και το πρόγραμμα. Κρατιέται αντίγραφο ασφαλείας.":"Borra todos los docentes, grupos, asignaciones y el horario. Se guarda una copia.","Διαγραφή όλων":"Eliminar todo","Διαγραφή όλων των δεδομένων":"Eliminar todos los datos","Είσαι σίγουρος; Θα μείνει μόνο το αντίγραφο ασφαλείας.":"¿Seguro? Solo quedará la copia de seguridad.","Αυτό το αρχείο είναι μέρος της εφαρμογής και δεν ανοίγει μόνο του σε browser.":"Este archivo forma parte de la aplicación y no se abre solo en un navegador.","Για να ανοίξεις την εφαρμογή:":"Para abrir la aplicación:","1. Κλείσε αυτή τη σελίδα.":"1. Cierra esta página.","2. Στον φάκελο της εφαρμογής κάνε διπλό κλικ στο «Εκκίνηση.cmd»":"2. En la carpeta de la aplicación, haz doble clic en «Start.cmd»","   (ή στο εικονίδιο «Ωρολόγιο» της επιφάνειας εργασίας, αν υπάρχει).":"   (o el icono «Ωρολόγιο» del escritorio, si existe).","Γλώσσα":"Idioma","Η εφαρμογή ξαναφορτώνει στη νέα γλώσσα. Τα δεδομένα δεν αλλάζουν.":"La aplicación se recarga en el nuevo idioma. Los datos no cambian.","π.χ. Φυσικός ή ο κωδι <script id="engine-src">/* Ωρολόγιο — κοινή «μηχανή»: μοντέλο, ανάλυση προγράμματος, αλγόριθμος.
   Τρέχει στο κύριο νήμα (ανάλυση), σε Web Worker (επίλυση) και σε Node (δοκιμές). */
(function (root) {
  'use strict';

  var W_HARD = 100000, W_GAP = 60, W_PREF = 8, W_SOFT = 40, W_BAL = 10, W_BAL2 = 200, W_FAIR = 30, W_SBAL = 300;   // W_SBAL: ισοκατανομή μαθητών (προσπάθεια)

  function key(d, h) { return d + '-' + h; }

  /* Μετατρέπει τα δεδομένα σε δομές με δείκτες. */
  function buildModel(data) {
    var D = data.settings.days, H = data.settings.hours, S = D * H;
    var tIndex = {}, teachers = [];
    data.teachers.forEach(function (t, i) { tIndex[t.id] = i; teachers.push(t); });
    var cById = {};

    var syncInfo = syncSets(data); MERGE_OF = syncInfo.mergeOf;

    function touchesOf(classIds) {

      var map = {};

        var tag = mixed ? (syncInfo.tag[c.id] || '') : '';

          if (!prev || (prev.tag && !t.tag)) map[b] = t;   // άμεσο υπερισχύει
        });
      });
      return Object.keys(map).map(function (k) { return map[k]; });
    }

    var asg = [];
    data.assignments.forEach(function (a) {
      if (tIndex[a.teacherId] === undefined) return;
      var cls = (a.classIds || []).filter(function (id) { return cById[id]; });
      if (!cls.length || !(a.hours > 0)) return;
      var t = teachers[tIndex[a.teacherId]];
      var allowed = [], pref = [], must = [];
      for (var d = 0; d < D; d++) for (var h = 0; h < H; h++) {
        var k = key(d, h), av = (t.avail || {})[k], sl = (a.slots || {})[k];
        allowed.push(av !== 'no' && sl !== 'never' && inRange(a, h) && slotAllowed(data, syncInfo, cById[cls[0]], d, h));
        pref.push(av === 'pref');

      }

        id: a.id, ai: asg.length, t: tIndex[a.teacherId], hours: a.hours | 0, split: a.split || 'single', blocks: blocksOf(a),
        sec: cls.length === 1 ? cls[0] : null, sync: cls.length === 1 && syncInfo.setOf[cls[0]] !== undefined ? syncInfo.setOf[cls[0]] : -1,
        maxPerDay: Math.max(1, a.maxPerDay || 1), noConsecutive: !!a.noConsecutive,
        allowed: allowed, pref: pref, must: must, touches: touchesOf(cls), label: labelOf(data, a)
      });
    });
    var aById = {}; asg.forEach(function (a) { aById[a.id] = a; });

    // «Υποομάδες μαθητών»: για κάθε τμήμα, ένας συνδυασμός ομάδων ανά ετικέτα παράλληλων ομάδων
    // (π.χ. Γ1 · Γαν, Γ1 · Γθετ). Κάθε υποομάδα πρέπει να έχει συνεχόμενες ώρες.
    var tagsByBase = {}, depTag = {};
    data.classes.forEach(function (c) {
      var tg = syncInfo.tag[c.id];
      if (!isMixed(c) || !tg || syncInfo.mergeOf[c.id]) return;
      if (c.members.some(function (mb) { return isMixed(cById[mb]); })) depTag[tg] = 1;
      baseClasses(data, c.id).forEach(function (mb) {
        var t = tagsByBase[mb] || (tagsByBase[mb] = {});

    });

    var sps = [], spsByBase = {};

      combos.forEach(function (cb) {

          var hit = tags[tg].filter(function (x) { return (cById[x].members || []).some(function (mb) { return chosen.indexOf(mb) >= 0; }); })[0];

      });

      spsByBase[b] = [];
      combos.forEach(function (cb) {
        var gnames = keys.map(function (tg) { return cById[cb[tg]] ? cById[cb[tg]].name : ''; }).filter(Boolean);
        var sp = { i: sps.length, base: b, choice: cb, name: (cById[b] ? cById[b].name : '') + (gnames.length ? ' · ' + gnames.join(' · ') : ''), N: 0 };
        sps.push(sp); spsByBase[b].push(sp.i);

    });
    asg.forEach(function (a) {
      var set = {};
      a.touches.forEach(function (tc) {
        (spsByBase[tc.base] || []).forEach(function (pi) {
          if (tc.tag) { var mo = syncInfo.mergeOf[tc.group], ch = sps[pi].choice[tc.tag]; if (mo ? mo.indexOf(ch) < 0 : ch !== tc.group) return; }
          set[pi] = 1;
        });
      });
      a.sp = Object.keys(set).map(Number);
      a.sp.forEach(function (pi) { sps[pi].N += a.hours; });
    });
    // ώρες λειτουργίας: ανά ημέρα οι ανοιχτές ώρες (κλειστές = εκτός ωραρίου του σχολείου)
    var openH = [], openDays = 0;
    for (var od = 0; od < D; od++) { var L = []; for (var oh = 0; oh < H; oh++) if (!isClosed(data, od, oh)) L.push(oh); openH.push(L); if (L.length) openDays++; }
    sps.forEach(function (sp) { sp.lo = Math.floor(sp.N / Math.max(1, openDays)); sp.hi = Math.ceil(sp.N / Math.max(1, openDays)); });
    var st = data.settings || {};
    // σετ ταυτόχρονων μικτών τμημάτων (μόνο όσα έχουν αναθέσεις)

      var cover = ids.map(function (id) { return mg.filter(function (x) { return (cById[x].members || []).indexOf(id) >= 0; }); });
      return { i: si, secs: ids, merges: mg, cover: cover, name: ids.map(function (id) { return cById[id].name; }).join(' / '),
        hours: ids.map(function (id, i) { return hrs(id) + cover[i].reduce(function (t, x) { return t + hrs(x); }, 0); }) };
    });
    // ομαλή κατανομή: «στόχος» ωρών ανά μέρα για κάθε καθηγητή (όχι κανόνας)
    var tLo = [], tWork = [];
    var tTarget = teachers.map(function (t, ti) {
      var need = 0; asg.forEach(function (a) { if (a.t === ti) need += a.hours; });
      var days = 0, wd = []; for (var d = 0; d < D; d++) { var any = false; for (var h = 0; h < H; h++) if ((t.avail || {})[key(d, h)] !== 'no' && !isClosed(data, d, h)) any = true; wd.push(any); if (any) days++; }
      tWork.push(wd); tLo.push(need ? Math.floor(need / Math.max(1, days)) : 0);
      return need ? Math.ceil(need / Math.max(1, days)) : 0;
    });
    return { D: D, H: H, S: S, openH: openH, closed: closedSet(data), teachers: teachers, asg: asg, aById: aById, sps: sps, syncs: syncs, tTarget: tTarget, tLo: tLo, tWork: tWork, smooth: (data.settings || {}).smoothTeachers !== false, fairGaps: (data.settings || {}).fairGaps !== false,
      studentRule: st.studentNoGaps !== false, balance: st.balanceDays !== false };
  }

  // «Από την … έως την … ώρα» (1-based, κενό = χωρίς όριο)
  function inRange(a, h) { return (!(a.fromHour > 0) || h + 1 >= a.fromHour) && (!(a.toHour > 0) || h + 1 <= a.toHour); }
  /* ---------- Ώρες λειτουργίας, ζώνες μαθημάτων, ομάδες ταυτόχρονων ----------

     settings.zones  : [{ id, name, slots: ['d-h'…], classIds: […] }]   — μαθήματα που μπαίνουν ΜΟΝΟ μέσα στη ζώνη·
                       μέσα στη ζώνη δεν μπαίνει κανένα άλλο μάθημα των ίδιων τμημάτων (της ίδιας τάξης)
     syncGroups      : [{ id, name, classIds: […], maxHour }]       — μαθήματα που γίνονται την ίδια ώρα */
  function closedSet(data) { var o = {}; ((data.settings || {}).closed || []).forEach(function (k) { o[k] = 1; }); return o; }
  function isClosed(data, d, h) { var c = (data.settings || {}).closed; return !!c && c.indexOf(d + '-' + h) >= 0; }
  function zoneList(data) { var z = (data.settings || {}).zones; return Array.isArray(z) ? z : []; }

  // παλιό όνομα: όλες οι ώρες όλων των ζωνών (για χρωματισμό επικεφαλίδων)
  function zonesG(data) { var out = []; zoneList(data).forEach(function (z) { (z.slots || []).forEach(function (k) { if (out.indexOf(k) < 0) out.push(k); }); }); return out; }

  function slotAllowed(data, info, c, d, h) {

    }

  }
  function inZone(data, c, d, h) { return slotAllowed(data, syncSets(data), c, d, h); }

  /* ---------- Αλγόριθμος: άπληστη τοποθέτηση + προσομοιωμένη ανόπτηση ---------- */

    if (first) m.el.addEventListener('mousedown', function (e) { e.stopPropagation(); }, true);
  }

  function boot() {
    try { document.title = T('Ωρολόγιο'); document.documentElement.lang = LANG; } catch (e) { }
    try { var r0 = JSON.parse(localStorage.getItem('orologio-schools') || 'null'); if (r0 && Array.isArray(r0.list)) SCH = r0; } catch (e) { }

    if (window.qt && window.qt.webChannelTransport && window.QWebChannel) {

        });
      });

    if (!BROWSER_MODE) {

      document.getElementById('app').appendChild(h('div', { style: 'margin:auto;max-width:560px;padding:40px 28px;display:flex;flex-direction:column;gap:14px;text-align:center' },
        h('div', { style: 'font-family:var(--serif);font-size:40px' }, T("Ωρολόγιο")),
        h('div', { style: 'line-height:1.6' }, T("Αυτό το αρχείο είναι μέρος της εφαρμογής και δεν ανοίγει μόνο του σε browser.")),
        h('div', { class: 'card', style: 'text-align:left;line-height:1.6' }, h('b', null, T("Για να ανοίξεις την εφαρμογή:")),
          h('div', null, T("1. Κλείσε αυτή τη σελίδα.")), h('div', null, T("2. Στον φάκελο της εφαρμογής κάνε διπλό κλικ στο «Εκκίνηση.cmd»")),

    if (!window.showDirectoryPicker) { store.unsupported = true; render(); if (!SCH.list.length) newSchoolDialog(true); return; }

    idb('get').then(function (dir) {

      return dir.queryPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') return useFolder(dir, false);

  }

  boot();
